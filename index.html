  try { if (mode) localStorage.setItem("halal-mode", mode); } catch (e) {}

  var path = standalone ? "/فتح-التطبيق" : "/زيارة-الرابط";
  var done = false, go = function () { if (!done && standalone) { done = true; location.replace(target); } };
  if (standalone) go();
  try {

    px.onload = px.onerror = go;
    if (!standalone) px.src = "https://halalkw.goatcounter.com/count?p=" + encodeURIComponent(path) +

  } catch (e) {}
  setTimeout(go, 900);
