<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المطاعم</title>
<meta name="apple-mobile-web-app-title" content="المطاعم">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d3c8f">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root { --blue:#1d4fbf; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:-apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(180deg,#0d3c8f,#1d63d6); color:#fff; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:420px; width:100%; text-align:center; }
  img { width:150px; height:150px; border-radius:34px; box-shadow:0 14px 40px rgba(0,0,0,.35); }
  h1 { font-size:30px; margin:18px 0 6px; }
  p { margin:0 0 22px; opacity:.85; line-height:1.7; }
  .steps { background:rgba(255,255,255,.12); border-radius:18px; padding:16px 18px; text-align:right; line-height:2; font-size:17px; }
  .steps b { color:#ffd84d; }
  a.btn { display:block; margin-top:18px; background:#fff; color:var(--blue); font-weight:800; font-size:18px;
    padding:15px; border-radius:16px; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <img src="icon.png" alt="">
  <h1>المطاعم</h1>
  <p>وين اللحم والدياي ذبح الكويت</p>
  <div class="steps" id="steps">
    عشان تنزّله على شاشتك:<br>
    ١. اضغط زر <b>المشاركة</b> تحت ⬆️<br>
    ٢. اختار <b>إضافة إلى الشاشة الرئيسية</b><br>
    ٣. اضغط <b>إضافة</b> ✅
  </div>
  <a class="btn" id="go" href="https://claude.ai/artifact/Mo9PveYVKT7zgCR16x7RVF">افتح المطاعم الحين</a>
</div>
<script>
  // إذا انفتح من أيقونة الشاشة الرئيسية، يروح للصفحة على طول
  var target = "https://claude.ai/artifact/Mo9PveYVKT7zgCR16x7RVF";
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (standalone) { location.replace(target); }
</script>
</body>
</html>
